name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Security scan (bandit)
        run: bandit -q -r scanner
      - name: Tests (pytest + moto for AWS, in-memory fake adapter for GCP)
        run: python -m pytest -q
      - name: GCP sample report builds without credentials
        run: PYTHONPATH=. python examples/generate_sample_gcp.py

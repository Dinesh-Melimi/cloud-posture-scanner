[project]
name = "cloud-posture-scanner"
version = "0.1.0"
description = "Read-only AWS security posture scanner for a subset of CIS AWS Foundations Benchmark controls"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dinesh Melimi" }]
dependencies = ["boto3>=1.34", "jinja2>=3.1"]

[project.scripts]
cloud-posture-scanner = "scanner.cli:main"

[tool.setuptools.packages.find]
include = ["scanner*"]

[tool.setuptools.package-data]
scanner = ["templates/*.j2"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
